
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priya Store | Orders</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }
        header {
            background: #14532d;
            color: white;
            padding: 22px 8%;
        }
        main { padding: 35px 8%; }
        .order {
            background: white;
            padding: 20px;
            margin: 16px 0;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000012;
        }
        .status {
            color: #087443;
            font-weight: bold;
        }
        button {
            background: #15803d;
            color: white;
            border: 0;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        #message { font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Priya Store</h1>
        <p>Order Management Portal</p>
    </header>

    <main>
        <h2>My Orders</h2>
        <p>View your recent sample orders below.</p>

        <div class="order">
            <h3>Order #1001</h3>
            <p>Product: Laptop</p>
            <p>Quantity: 1</p>
            <p class="status">Status: Shipped</p>
        </div>

        <div class="order">
            <h3>Order #1002</h3>
            <p>Product: Headphones</p>
            <p>Quantity: 2</p>
            <p class="status">Status: Processing</p>
        </div>

        <button onclick="refreshOrders()">Refresh Orders</button>
        <p id="message"></p>
    </main>

    <script>
        function refreshOrders() {
            document.getElementById("message").textContent =
                "Sample order list refreshed successfully!";
        }
    </script>
</body>
</html>
